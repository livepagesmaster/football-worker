<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Manager</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; color: #222; padding: 20px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  
  #lock { display: flex; align-items: center; justify-content: center; min-height: 80vh; }
  #lock .box { background: #fff; border: 1px solid #e0e0e0; border-radius: 14px; padding: 32px; width: 100%; max-width: 400px; text-align: center; }
  #lock input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 12px; }
  #lock button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 700; cursor: pointer; }

  #app { display: none; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .topbar h1 { font-size: 22px; font-weight: 800; }
  .btn-save { background: #16a34a; color: #fff; padding: 10px 20px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; }
  
  .match-item { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .match-header { padding: 16px; background: #f9fafb; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .match-header h3 { font-size: 16px; margin: 0; }
  .match-header .meta { font-size: 12px; color: #666; margin-top: 4px; }
  .match-body { padding: 16px; display: none; }
  .match-item.open .match-body { display: block; }
  
  .input-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 16px; }
  .input-row { display: flex; gap: 10px; align-items: center; background: #fafafa; padding: 10px; border-radius: 8px; border: 1px solid #eee; }
  .input-row select { padding: 9px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: #fff; outline: none; }
  .input-row input { flex: 1; padding: 9px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; }
  
  .empty { text-align: center; padding: 40px; color: #888; background: #fff; border-radius: 10px; border: 1px dashed #ccc; }
  @media (max-width: 600px) { .input-row { flex-direction: column; align-items: stretch; } }
</style>
</head>
<body>

<div id="lock">
  <div class="box">
    <h1>Link Manager</h1>
    <p style="margin-bottom:20px; color:#666; font-size:14px;">Enter token to unlock</p>
    <input type="password" id="tokenInput" placeholder="ghp_...">
    <button id="unlockBtn">Unlock</button>
  </div>
</div>

<div id="app" class="wrap">
  <div class="topbar">
    <h1>Manage Stream Links</h1>
    <button class="btn-save" id="saveBtn">Save to Cloudflare</button>
  </div>
  <div id="matchesList"></div>
</div>

<script>
const REPO_OWNER = "livepagesmaster";
const REPO_NAME  = "football-worker";
const BRANCH     = "main";
const FEED_URL   = 'https://football-feed.pages.dev/matchfeed.json';
const LINKS_URL  = 'https://football-feed.pages.dev/links.json';
const API_BASE   = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;
const TOKEN_KEY  = "gh_token_fw";

let activeMatches = [];
let currentLinks = {};

function getToken() { return localStorage.getItem(TOKEN_KEY); }

async function unlock() {
    const token = document.getElementById("tokenInput").value.trim();
    if(!token) return alert("Enter token");
    try {
        const r = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`, { headers: { Authorization: `Bearer ${token}` } });
        if(r.ok) { localStorage.setItem(TOKEN_KEY, token); showApp(); }
        else alert("Invalid token");
    } catch(e) { alert("Error checking token"); }
}
document.getElementById("unlockBtn").onclick = unlock;

function showApp() {
    document.getElementById("lock").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadData();
}

async function loadData() {
    try {
        const [feedRes, linksRes] = await Promise.all([
            fetch(FEED_URL + "?t=" + Date.now()),
            fetch(LINKS_URL + "?t=" + Date.now()).catch(() => null)
        ]);
        
        const feed = await feedRes.json();
        activeMatches = feed.matches || [];
        
        if(linksRes && linksRes.ok) {
            currentLinks = await linksRes.json();
        } else {
            currentLinks = {};
        }
        
        renderList();
    } catch(e) {
        console.error(e);
        document.getElementById("matchesList").innerHTML = '<div class="empty">Failed to load matches.</div>';
    }
}

function renderList() {
    const container = document.getElementById("matchesList");
    if(activeMatches.length === 0) {
        container.innerHTML = `<div class="empty">No matches on widget right now.<br>Add matches in your main dashboard first.</div>`;
        return;
    }

    container.innerHTML = activeMatches.map(m => {
        const urlStr = m.redirectUrl || "";
        const matchId = urlStr.includes('id=') ? urlStr.split('id=')[1] : `${m.team1.name}-vs-${m.team2.name}`;
        const safeId = matchId.replace(/[^a-zA-Z0-9]/g, '');
        
        const saved = currentLinks[matchId] || {};
        
        // Create 7 rows
        let rowsHtml = '';
        for(let i=1; i<=7; i++) {
            const linkObj = saved[`link${i}`] || { type: 'redirect', url: '' };
            // Backwards compatibility if it was just a string
            const lType = typeof linkObj === 'string' ? 'redirect' : (linkObj.type || 'redirect');
            const lUrl = typeof linkObj === 'string' ? linkObj : (linkObj.url || '');

            rowsHtml += `
                <div class="input-row">
                    <select id="type${i}-${safeId}">
                        <option value="redirect" ${lType === 'redirect' ? 'selected' : ''}>Redirect</option>
                        <option value="iframe" ${lType === 'iframe' ? 'selected' : ''}>Iframe / Embed</option>
                        <option value="hls" ${lType === 'hls' ? 'selected' : ''}>M3U8 / HLS</option>
                    </select>
                    <input type="text" id="link${i}-${safeId}" value="${lUrl}" placeholder="https://...">
                </div>
            `;
        }

        return `
            <div class="match-item" id="card-${safeId}">
                <div class="match-header" onclick="toggleItem('${safeId}')">
                    <div>
                        <h3>${m.team1.name} vs ${m.team2.name}</h3>
                        <div class="meta">${m.type} · ${m.time}</div>
                    </div>
                    <span>▼</span>
                </div>
                <div class="match-body">
                    <div style="margin-bottom:15px; background:#eff6ff; padding:12px; border-radius:8px; border:1px solid #bfdbfe;">
                        <label style="font-size:12px; font-weight:bold; color:#1d4ed8; display:block; margin-bottom:5px;">Common Link (Fallback for all)</label>
                        <div class="input-row" style="background:transparent; border:none; padding:0;">
                            <select id="typeCommon-${safeId}">
                                <option value="redirect" ${saved.common?.type === 'redirect' ? 'selected' : ''}>Redirect</option>
                                <option value="iframe" ${saved.common?.type === 'iframe' ? 'selected' : ''}>Iframe</option>
                                <option value="hls" ${saved.common?.type === 'hls' ? 'selected' : ''}>M3U8</option>
                            </select>
                            <input type="text" id="common-${safeId}" value="${saved.common?.url || saved.common || ''}" placeholder="https://...">
                        </div>
                    </div>
                    
                    <div class="input-grid">
                        ${rowsHtml}
                    </div>
                </div>
            </div>
        `;
    }).join("");
}

window.toggleItem = function(safeId) {
    document.getElementById(`card-${safeId}`).classList.toggle('open');
}

document.getElementById("saveBtn").onclick = () => {
    const btn = document.getElementById("saveBtn");
    const oldText = btn.textContent;
    btn.textContent = "Saving...";
    btn.disabled = true;

    activeMatches.forEach(m => {
        const urlStr = m.redirectUrl || "";
        const matchId = urlStr.includes('id=') ? urlStr.split('id=')[1] : `${m.team1.name}-vs-${m.team2.name}`;
        const safeId = matchId.replace(/[^a-zA-Z0-9]/g, '');
        
        if(document.getElementById(`common-${safeId}`)) {
            const commonUrl = document.getElementById(`common-${safeId}`).value.trim();
            const commonType = document.getElementById(`typeCommon-${safeId}`).value;
            
            const linkData = {
                common: commonUrl ? { type: commonType, url: commonUrl } : null
            };
            
            for(let i=1; i<=7; i++) {
                const url = document.getElementById(`link${i}-${safeId}`).value.trim();
                const type = document.getElementById(`type${i}-${safeId}`).value;
                linkData[`link${i}`] = url ? { type, url } : null;
            }
            
            currentLinks[matchId] = linkData;
        }
    });

    pushToGitHub(currentLinks);
};

async function pushToGitHub(dataObj) {
    const token = getToken();
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(dataObj, null, 2))));
    const filePath = "data/links.json";
    const btn = document.getElementById("saveBtn");

    try {
        const getRes = await fetch(`${API_BASE}${filePath}?ref=${BRANCH}`, { headers: { Authorization: `Bearer ${token}` } });
        let sha;
        if(getRes.ok) { const j = await getRes.json(); sha = j.sha; }

        const putRes = await fetch(`${API_BASE}${filePath}`, {
            method: "PUT",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: "Update stream links", content, branch: BRANCH, sha })
        });
        
        if(putRes.ok) {
            btn.textContent = "Saved!";
            setTimeout(() => { btn.textContent = oldText; btn.disabled = false; }, 2000);
        } else {
            alert("Failed to save links.");
            btn.textContent = oldText;
            btn.disabled = false;
        }
    } catch(e) {
        alert("Network error.");
        btn.textContent = oldText;
        btn.disabled = false;
    }
}

if(getToken()) {
    fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`, { headers: { Authorization: `Bearer ${getToken()}` } })
    .then(r => { if(r.ok) showApp(); else localStorage.removeItem(TOKEN_KEY); });
}
</script>
</body>
</html>
