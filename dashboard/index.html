<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Selector</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; color: #222; min-height: 100vh; }
  #lock { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  #lock .box { background: #fff; border: 1px solid #e0e0e0; border-radius: 14px; padding: 32px 28px; max-width: 400px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,.06); text-align: center; }
  #lock h1 { font-size: 20px; margin-bottom: 6px; font-weight: 700; }
  #lock input { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; margin-bottom: 12px;}
  #lock button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
  #app { display: none; padding: 20px; max-width: 900px; margin: 0 auto; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .topbar h1 { font-size: 22px; font-weight: 800; }
  .topbar-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .counter { font-size: 13px; font-weight: 700; color: #2563eb; background: #eff6ff; padding: 6px 14px; border-radius: 8px; border: 1px solid #dbeafe; }
  .my-sel-btn { font-size: 13px; font-weight: 700; color: #fff; background: #7c3aed; padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer; position: relative; }
  .logout { padding: 6px 14px; font-size: 12px; font-weight: 600; background: #e5e7eb; border: none; border-radius: 6px; cursor: pointer; color: #444; }
  .search-hero { background: #fff; border: 1px solid #e0e0e0; border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .search-hero input { width: 100%; padding: 14px 18px; border: 2px solid #dbeafe; border-radius: 12px; font-size: 16px; font-family: inherit; outline: none; transition: border-color .15s; background: #f8fbff; }
  .search-hero input:focus { border-color: #2563eb; background: #fff; }
  .search-hero .hint { font-size: 12px; color: #888; margin-top: 10px; text-align: center; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .filters button { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #e0e0e0; background: #fff; color: #444; }
  .filters button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  .toolbar { position: sticky; top: 0; z-index: 10; background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .toolbar .toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #444; user-select: none; cursor: pointer; }
  .toolbar .count { font-size: 12px; font-weight: 600; color: #888; }
  .toolbar button { padding: 8px 14px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-save { background: #16a34a; color: #fff; margin-left: auto; }
  .match-list { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; overflow: hidden; }
  .match { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #f0f0f0; cursor: pointer; user-select: none; }
  .match input[type=checkbox] { width: 18px; height: 18px; flex-shrink: 0; cursor: pointer; accent-color: #2563eb; }
  .match .col-main { flex: 1; min-width: 0; }
  .match .teams { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .match .league { font-size: 11px; color: #999; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .match .col-time { text-align: right; flex-shrink: 0; }
  .match .date { font-size: 13px; font-weight: 700; color: #333; white-space: nowrap; }
  .match .time { font-size: 11px; color: #888; margin-top: 3px; white-space: nowrap; }
  .empty { text-align: center; padding: 60px 20px; color: #999; font-size: 14px; }
  .loading { text-align: center; padding: 40px; color: #888; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: #16a34a; color: #fff; padding: 12px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 300; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: #dc2626; }
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
  .modal-backdrop.open { display: flex; }
  .modal { background: #fff; border-radius: 14px; max-width: 720px; width: 100%; max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal-head { padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .modal-head h2 { font-size: 17px; font-weight: 800; }
  .modal-head .close { background: #f0f0f0; border: none; border-radius: 6px; width: 30px; height: 30px; font-size: 18px; cursor: pointer; color: #555; }
  .modal-body { overflow-y: auto; padding: 12px 20px 20px; flex: 1; }
  .sel-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
  .sel-item .sel-info { flex: 1; min-width: 0; }
  .sel-item .sel-teams { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sel-item .sel-meta { font-size: 11px; color: #999; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sel-item .remove { background: #fee2e2; color: #b91c1c; border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
  .modal-foot { padding: 12px 20px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #666; }
  .modal-foot .danger { background: #fee2e2; color: #b91c1c; border: none; border-radius: 6px; padding: 8px 14px; font-weight: 700; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>

<div id="lock">
  <div class="box">
    <div class="lock-icon">🔒</div>
    <h1>Match Selector</h1>
    <p style="margin-bottom:20px; font-size:14px; color:#666;">Enter token to unlock</p>
    <input type="password" id="tokenInput" placeholder="ghp_...">
    <button id="unlockBtn">Unlock</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <h1>Match Selector</h1>
    <div class="topbar-right">
      <span class="counter" id="counter">Selected: 0</span>
      <button class="my-sel-btn" id="mySelBtn">My Selection (0)</button>
      <button class="logout" id="logoutBtn">Lock</button>
    </div>
  </div>
  <div class="search-hero">
    <input type="text" id="search" placeholder="Type team or league to search…" autofocus autocomplete="off">
    <div class="hint" id="hint">Start typing to see matches — results are sorted by date.</div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="toolbar">
    <label class="toggle"><input type="checkbox" id="onlySelected"><span>Only selected</span></label>
    <span class="count" id="resultCount"></span>
    <button class="btn-save" id="saveBtn">Save</button>
  </div>
  <div id="content"><div class="empty">Start typing above to search for matches.</div></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">My Selection (0)</h2>
      <button class="close" id="modalClose">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <span id="modalFootLeft">0 matches selected</span>
      <button class="danger" id="modalClearBtn">Clear all</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const REPO_OWNER = "livepagesmaster";
const REPO_NAME  = "football-worker";
const BRANCH     = "main";
const MATCHES_URL = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/data/all-matches.json`;
const SELECTED_PATH = "data/selected.json";
const API_BASE = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${SELECTED_PATH}`;
const TOKEN_KEY = "gh_token_fw";

const QUICK_LEAGUES = ["Champions League", "Premier League", "Bundesliga", "LaLiga", "Serie A", "Ligue 1", "Liga Portugal", "Brasileirão", "Saudi Pro League", "MLS"];
const WOMEN_KEYWORDS = ["women", "wsl", "nwsl", "(w)", " w ", "femminile", "féminine", "femenina"];

let allMatches = [];
let selectedMatches = [];
let selectedIds = new Set();
let pendingSave = false;

function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }
function toast(msg, isError = false) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.toggle("error", isError); t.classList.add("show"); clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove("show"), 2600); }
function escapeHtml(s) { if (s == null) return ""; return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function isWomenLeague(name) { const lower = (name || "").toLowerCase(); return WOMEN_KEYWORDS.some(k => lower.includes(k)); }
function parseStart(iso) { if (!iso) return Infinity; const t = new Date(iso).getTime(); return isNaN(t) ? Infinity : t; }
function formatDate(iso) { if (!iso) return ""; try { return new Date(iso).toLocaleDateString([], { month: "short", day: "numeric" }); } catch { return ""; } }
function formatTimeOnly(iso) { if (!iso) return ""; try { return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); } catch { return ""; } }

async function verifyToken(token) { try { const r = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`, { headers: { Authorization: `Bearer ${token}` } }); return r.ok; } catch { return false; } }

async function unlock() {
  const input = document.getElementById("tokenInput"), btn = document.getElementById("unlockBtn"), err = document.getElementById("errMsg");
  const token = input.value.trim(); if (!token) return alert("Enter token");
  btn.disabled = true; btn.textContent = "Checking…";
  const ok = await verifyToken(token); btn.disabled = false; btn.textContent = "Unlock";
  if (!ok) return alert("Invalid token");
  setToken(token); showDashboard();
}

function showDashboard() { document.getElementById("lock").style.display = "none"; document.getElementById("app").style.display = "block"; init(); }
function lock() { clearToken(); location.reload(); }

async function loadAll() { const r = await fetch(MATCHES_URL + "?t=" + Date.now(), { cache: "no-store" }); const j = await r.json(); allMatches = Array.isArray(j.matches) ? j.matches : []; }
async function loadSelected() { try { const r = await fetch(`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${SELECTED_PATH}?t=${Date.now()}`, { cache: "no-store" }); if (!r.ok) { selectedMatches = []; selectedIds = new Set(); return; } const j = await r.json(); selectedMatches = (j.matches || []).map(m => ({ ...m })); selectedIds = new Set(selectedMatches.map(m => String(m.event_id))); } catch { selectedMatches = []; selectedIds = new Set(); } }

function buildQuickFilters() {
  const wrap = document.getElementById("filters");
  const available = new Set(allMatches.map(m => m.league || "").filter(Boolean));
  const visible = QUICK_LEAGUES.filter(name => { const lower = name.toLowerCase(); for (const lg of available) if (lg.toLowerCase().includes(lower)) return true; return false; });
  wrap.innerHTML = `<button data-val="" class="active">All</button>` + visible.map(name => `<button data-val="${escapeHtml(name)}">${escapeHtml(name)}</button>`).join("");
  wrap.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => { document.getElementById("search").value = btn.getAttribute("data-val"); wrap.querySelectorAll("button").forEach(b => b.classList.remove("active")); btn.classList.add("active"); render(); }));
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase(), onlySelected = document.getElementById("onlySelected").checked;
  const content = document.getElementById("content"), countEl = document.getElementById("resultCount");
  const searching = q.length > 0; let list = allMatches;
  
  if (searching) list = list.filter(m => ((m.team1 || "") + " " + (m.team2 || "") + " " + (m.league || "")).toLowerCase().includes(q));
  if (!searching || !/women|wsl|nwsl|femminile|féminine|femenina/i.test(q)) list = list.filter(m => !isWomenLeague(m.league || ""));
  if (onlySelected) list = list.filter(m => selectedIds.has(String(m.event_id)));
  
  if (!searching && !onlySelected) { content.innerHTML = `<div class="empty">Start typing above, or tap a league chip to browse.</div>`; countEl.textContent = ""; updateCounter(); return; }
  if (!list.length) { content.innerHTML = `<div class="empty">No matches found.</div>`; countEl.textContent = "0 results"; updateCounter(); return; }

  const sorted = [...list].sort((a, b) => { const ta = parseStart(a.start), tb = parseStart(b.start); if (ta !== tb) return ta - tb; return (a.team1 || "").localeCompare(b.team1 || ""); });
  const MAX_RESULTS = 500, truncated = sorted.length > MAX_RESULTS, show = truncated ? sorted.slice(0, MAX_RESULTS) : sorted;
  
  const rows = show.map(m => {
    const checked = selectedIds.has(String(m.event_id)) ? "checked" : "";
    return `
      <label class="match">
        <input type="checkbox" ${checked} data-eid="${escapeHtml(String(m.event_id))}" onchange="toggleMatch(this)">
        <div class="col-main">
          <div class="teams">${escapeHtml(m.team1)} vs ${escapeHtml(m.team2)}</div>
          <div class="league">${escapeHtml(m.league || "")}</div>
        </div>
        <div class="col-time">
          <div class="date">${escapeHtml(formatDate(m.start))}</div>
          <div class="time">${escapeHtml(formatTimeOnly(m.start))}</div>
        </div>
      </label>`;
  }).join("");

  content.innerHTML = `<div class="match-list">${rows}</div>` + (truncated ? `<div class="empty" style="padding:16px;">Showing first ${MAX_RESULTS} of ${sorted.length}.</div>` : "");
  countEl.textContent = `${sorted.length} result${sorted.length === 1 ? "" : "s"}`;
  updateCounter();
}

function toggleMatch(cb) {
  const eid = String(cb.getAttribute("data-eid"));
  if (cb.checked) {
    selectedIds.add(eid);
    const feed = allMatches.find(m => String(m.event_id) === eid);
    if (feed && !selectedMatches.find(s => String(s.event_id) === eid)) selectedMatches.push({ ...feed });
  } else {
    selectedIds.delete(eid);
    selectedMatches = selectedMatches.filter(s => String(s.event_id) !== eid);
  }
  pendingSave = true; updateCounter(); updateMySelButton();
}

function updateCounter() { document.getElementById("counter").textContent = `Selected: ${selectedIds.size}`; }
function updateMySelButton() { document.getElementById("mySelBtn").textContent = `My Selection (${selectedIds.size})`; }

function openModal() { renderModalBody(); document.getElementById("modalBackdrop").classList.add("open"); }
function closeModal() { document.getElementById("modalBackdrop").classList.remove("open"); }

function renderModalBody() {
  const title = document.getElementById("modalTitle"), foot = document.getElementById("modalFootLeft"), body = document.getElementById("modalBody");
  title.textContent = `My Selection (${selectedMatches.length})`;
  foot.textContent = `${selectedMatches.length} matches selected`;

  if (!selectedMatches.length) { body.innerHTML = `<div class="modal-empty">No matches selected yet.</div>`; return; }

  body.innerHTML = [...selectedMatches].sort((a,b) => parseStart(a.start) - parseStart(b.start)).map(m => `
      <div class="sel-item">
        <div class="sel-info">
          <div class="sel-teams">${escapeHtml(m.team1)} vs ${escapeHtml(m.team2)}</div>
          <div class="sel-meta">${escapeHtml(m.league || "")} · ${escapeHtml(formatDate(m.start))}</div>
        </div>
        <button class="remove" onclick="removeFromSelection('${escapeHtml(String(m.event_id))}')">Remove</button>
      </div>
    `).join("");
}

function removeFromSelection(eid) { selectedIds.delete(String(eid)); selectedMatches = selectedMatches.filter(s => String(s.event_id) !== String(eid)); pendingSave = true; updateCounter(); updateMySelButton(); renderModalBody(); render(); }
function clearAllSelection() { if (!selectedMatches.length) return; if (!confirm(`Clear all ${selectedMatches.length} selected matches?`)) return; selectedIds.clear(); selectedMatches = []; pendingSave = true; updateCounter(); updateMySelButton(); renderModalBody(); render(); toast("Cleared — click Save to apply"); }

async function saveSelection() {
  const token = getToken(); if (!token) return lock();
  const btn = document.getElementById("saveBtn"); btn.disabled = true; btn.textContent = "Saving…";
  
  const payload = { matches: selectedMatches, updated_at: new Date().toISOString() };
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));
  let sha;
  try { const r = await fetch(`${API_BASE}?ref=${BRANCH}`, { headers: { Authorization: `Bearer ${token}` } }); if (r.ok) sha = (await r.json()).sha; } catch {}

  const body = { message: "Update selection", content, branch: BRANCH, ...(sha ? { sha } : {}) };
  try {
    const r = await fetch(API_BASE, { method: "PUT", headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (r.ok) { pendingSave = false; toast("Saved — widget will update within a minute"); } else { toast("Save failed", true); }
  } catch (e) { toast("Save failed", true); }
  btn.disabled = false; btn.textContent = "Save";
}

async function init() { document.getElementById("content").innerHTML = `<div class="loading">Loading matches…</div>`; try { await loadSelected(); await loadAll(); } catch (e) { return; } buildQuickFilters(); updateMySelButton(); setTimeout(() => document.getElementById("search").focus(), 100); render(); }

document.getElementById("unlockBtn").addEventListener("click", unlock);
document.getElementById("tokenInput").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
document.getElementById("logoutBtn").addEventListener("click", lock);
document.getElementById("search").addEventListener("input", render);
document.getElementById("onlySelected").addEventListener("change", render);
document.getElementById("saveBtn").addEventListener("click", saveSelection);
document.getElementById("mySelBtn").addEventListener("click", openModal);
document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("modalClearBtn").addEventListener("click", clearAllSelection);
document.getElementById("modalBackdrop").addEventListener("click", e => { if (e.target.id === "modalBackdrop") closeModal(); });
window.toggleMatch = toggleMatch; window.removeFromSelection = removeFromSelection;

if(getToken()) { fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`, { headers: { Authorization: `Bearer ${getToken()}` } }).then(r => { if(r.ok) showDashboard(); else clearToken(); }); }
</script>
</body>
</html>
