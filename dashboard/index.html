<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Selector</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7; color: #222;
    min-height: 100vh;
  }

  /* ---------- LOCK SCREEN ---------- */
  #lock {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  #lock .box {
    background: #fff; border: 1px solid #e0e0e0; border-radius: 14px;
    padding: 32px 28px; max-width: 400px; width: 100%;
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
    text-align: center;
  }
  #lock .lock-icon { font-size: 40px; margin-bottom: 12px; }
  #lock h1 { font-size: 20px; margin-bottom: 6px; font-weight: 700; }
  #lock p { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.5; }
  #lock input {
    width: 100%; padding: 12px 14px;
    border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; font-family: inherit; outline: none;
  }
  #lock input:focus { border-color: #2563eb; }
  #lock button {
    width: 100%; margin-top: 12px;
    padding: 12px; border: none; border-radius: 8px;
    background: #2563eb; color: #fff;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  #lock button:hover { background: #1d4ed8; }
  #lock button:disabled { background: #93b3f5; cursor: wait; }
  #lock .err {
    display: none; margin-top: 12px;
    font-size: 13px; color: #dc2626;
  }

  /* ---------- DASHBOARD ---------- */
  #app { display: none; padding: 20px; max-width: 960px; margin: 0 auto; }
  #app .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
  }
  #app h1 { font-size: 20px; font-weight: 800; }
  #app .topbar-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #app .counter {
    font-size: 13px; font-weight: 700; color: #2563eb;
    background: #eff6ff; padding: 6px 14px; border-radius: 8px;
    border: 1px solid #dbeafe;
  }
  #app .my-sel-btn {
    font-size: 13px; font-weight: 700; color: #fff;
    background: #7c3aed; padding: 6px 14px; border-radius: 8px;
    border: none; cursor: pointer;
  }
  #app .my-sel-btn:hover { background: #6d28d9; }
  #app .logout {
    padding: 6px 14px; font-size: 12px; font-weight: 600;
    background: #e5e7eb; border: none; border-radius: 6px;
    cursor: pointer; color: #444;
  }
  #app .logout:hover { background: #d1d5db; }

  .toolbar {
    position: sticky; top: 0; z-index: 10;
    background: #fff; border: 1px solid #e0e0e0;
    border-radius: 10px; padding: 12px;
    margin-bottom: 14px;
    display: flex; flex-wrap: wrap; gap: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  .toolbar input[type=text] {
    flex: 1; min-width: 160px;
    padding: 9px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px; outline: none;
  }
  .toolbar input[type=text]:focus { border-color: #2563eb; }
  .toolbar select {
    padding: 9px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 13px; outline: none;
    background: #fff; cursor: pointer;
    max-width: 260px;
  }
  .toolbar select:focus { border-color: #2563eb; }
  .toolbar button {
    padding: 9px 16px; border: none; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-sec { background: #e5e7eb; color: #222; }
  .btn-sec:hover { background: #d1d5db; }
  .btn-save { background: #16a34a; color: #fff; }
  .btn-save:hover { background: #15803d; }
  .btn-save:disabled { background: #86d0a2; cursor: wait; }

  .toggle {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; color: #444;
    padding: 0 6px; user-select: none; cursor: pointer;
  }
  .toggle input {
    width: 16px; height: 16px; accent-color: #2563eb; cursor: pointer;
  }

  .group {
    background: #fff; border: 1px solid #e0e0e0;
    border-radius: 10px; margin-bottom: 10px; overflow: hidden;
  }
  .group-header {
    padding: 11px 14px; font-weight: 700; font-size: 14px;
    background: #f9fafb; border-bottom: 1px solid transparent;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; user-select: none;
    transition: background .15s;
  }
  .group-header:hover { background: #f1f3f7; }
  .group.open .group-header { border-bottom-color: #eee; }
  .group-header .left {
    display: flex; align-items: center; gap: 8px;
    min-width: 0; flex: 1;
  }
  .group-header .arrow {
    display: inline-block; width: 12px; font-size: 10px;
    color: #888; transition: transform .15s;
  }
  .group.open .group-header .arrow { transform: rotate(90deg); }
  .group-header .name {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .group-header .badges {
    display: flex; gap: 6px; flex-shrink: 0;
  }
  .badge {
    font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 9999px;
  }
  .badge-total { background: #eef2f7; color: #666; }
  .badge-selected { background: #dcfce7; color: #16a34a; }
  .group-body { display: none; }
  .group.open .group-body { display: block; }

  .match {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid #f0f0f0;
    cursor: pointer; user-select: none;
  }
  .match:last-child { border-bottom: none; }
  .match:hover { background: #fafafa; }
  .match input[type=checkbox] {
    width: 18px; height: 18px; flex-shrink: 0; cursor: pointer;
    accent-color: #2563eb;
  }
  .match .teams { flex: 1; font-size: 14px; min-width: 0; }
  .match .teams .names {
    font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .match .teams .sub {
    font-size: 11px; color: #999; margin-top: 2px;
  }
  .match .time {
    font-size: 12px; color: #666; flex-shrink: 0;
    white-space: nowrap;
  }

  .empty { text-align: center; padding: 60px 20px; color: #999; font-size: 14px; }
  .loading { text-align: center; padding: 40px; color: #888; }

  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #16a34a; color: #fff;
    padding: 12px 22px; border-radius: 8px;
    font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: #dc2626; }

  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 200;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff; border-radius: 14px;
    max-width: 640px; width: 100%;
    max-height: 85vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .modal-head {
    padding: 16px 20px;
    border-bottom: 1px solid #eee;
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-head h2 { font-size: 17px; font-weight: 800; }
  .modal-head .close {
    background: #f0f0f0; border: none; border-radius: 6px;
    width: 30px; height: 30px; font-size: 18px; cursor: pointer;
    color: #555;
  }
  .modal-head .close:hover { background: #e0e0e0; }
  .modal-body { overflow-y: auto; padding: 12px 20px 20px; flex: 1; }
  .sel-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid #f0f0f0;
  }
  .sel-item:last-child { border-bottom: none; }
  .sel-item .sel-info { flex: 1; min-width: 0; }
  .sel-item .sel-teams {
    font-size: 14px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sel-item .sel-meta { font-size: 11px; color: #999; margin-top: 2px; }
  .sel-item .remove {
    background: #fee2e2; color: #b91c1c;
    border: none; border-radius: 6px;
    padding: 6px 10px; font-size: 12px; font-weight: 700;
    cursor: pointer; flex-shrink: 0;
  }
  .sel-item .remove:hover { background: #fecaca; }
  .modal-empty { text-align: center; padding: 40px 20px; color: #999; font-size: 14px; }
  .modal-foot {
    padding: 12px 20px; border-top: 1px solid #eee;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: #666;
  }
  .modal-foot .danger {
    background: #fee2e2; color: #b91c1c;
    border: none; border-radius: 6px;
    padding: 8px 14px; font-weight: 700; font-size: 13px;
    cursor: pointer;
  }
  .modal-foot .danger:hover { background: #fecaca; }

  @media (max-width: 600px) {
    .toolbar select { max-width: 100%; }
    #app { padding: 12px; }
  }
</style>
</head>
<body>

<div id="lock">
  <div class="box">
    <div class="lock-icon">🔒</div>
    <h1>Match Selector</h1>
    <p>Enter your access token to continue.</p>
    <input type="password" id="tokenInput" placeholder="Paste token" autocomplete="off">
    <button id="unlockBtn">Unlock</button>
    <div class="err" id="errMsg">Invalid token. Try again.</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <h1>Match Selector</h1>
    <div class="topbar-right">
      <span class="counter" id="counter">Selected: 0 of 0</span>
      <button class="my-sel-btn" id="mySelBtn">My Selection (0)</button>
      <button class="logout" id="logoutBtn">Lock</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Search team or league… (searches all leagues)">
    <select id="leagueFilter">
      <option value="__default__">Default leagues</option>
    </select>
    <label class="toggle">
      <input type="checkbox" id="onlySelected">
      <span>Only selected</span>
    </label>
    <button class="btn-sec" id="selectAllBtn">Select all</button>
    <button class="btn-sec" id="clearBtn">Clear</button>
    <button class="btn-save" id="saveBtn">Save</button>
  </div>

  <div id="content"><div class="loading">Loading…</div></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">My Selection (0)</h2>
      <button class="close" id="modalClose">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <span id="modalFootLeft">0 matches selected</span>
      <button class="danger" id="modalClearBtn">Clear all</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================================================================
// CONFIG
// ==================================================================
const REPO_OWNER = "livepagesmaster";
const REPO_NAME  = "football-worker";
const BRANCH     = "main";

const MATCHES_URL = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/data/all-matches.json`;
const SELECTED_PATH = "data/selected.json";
const API_BASE = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${SELECTED_PATH}`;

const TOKEN_KEY = "gh_token_fw";

// Whitelist — matched by league_id. Only these show by default.
// Get IDs from all-matches.json if any look wrong.
const DEFAULT_LEAGUES = [
  { id: 42,  label: "Champions League" },        // UEFA Champions League
  { id: 47,  label: "Premier League (England)" },
  { id: 54,  label: "Bundesliga (Germany)" },
  { id: 87,  label: "LaLiga (Spain)" },
  { id: 55,  label: "Serie A (Italy)" },
  { id: 53,  label: "Ligue 1 (France)" },
  { id: 61,  label: "Liga Portugal" },
  { id: 268, label: "Brasileirão (Brazil)" },
  { id: 536, label: "Saudi Pro League" },
  { id: 130, label: "MLS (USA)" },
];

// Hide any league whose name contains one of these (case-insensitive).
const WOMEN_KEYWORDS = ["women", "wsl", "nwsl", "(w)", " w ", "femminile", "féminine", "femenina"];

// ==================================================================

let allMatches = [];
let selectedIds = new Set();
let leagueGroups = {};       // groupKey -> { id, label, matches }
let defaultGroupKeys = new Set();

// ============ HELPERS ============
function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }

function toast(msg, isError = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("error", isError);
  t.classList.add("show");
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove("show"), 2400);
}

function formatTime(iso) {
  if (!iso) return "";
  try {
    return new Date(iso).toLocaleString([], {
      month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  } catch { return ""; }
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function isWomenLeague(name) {
  const lower = (name || "").toLowerCase();
  return WOMEN_KEYWORDS.some(k => lower.includes(k));
}

function findWhitelist(leagueId) {
  if (leagueId == null) return null;
  return DEFAULT_LEAGUES.find(c => String(c.id) === String(leagueId)) || null;
}

function labelForMatch(m) {
  const cfg = findWhitelist(m.league_id);
  if (cfg) return cfg.label;
  return m.league || "Other";
}

// ============ TOKEN VERIFY ============
async function verifyToken(token) {
  try {
    const r = await fetch(
      `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`,
      { headers: { Authorization: `Bearer ${token}` } }
    );
    return r.ok;
  } catch { return false; }
}

// ============ UNLOCK / LOCK ============
async function unlock() {
  const input = document.getElementById("tokenInput");
  const btn = document.getElementById("unlockBtn");
  const err = document.getElementById("errMsg");
  const token = input.value.trim();
  if (!token) { err.textContent = "Enter a token."; err.style.display = "block"; return; }

  btn.disabled = true; btn.textContent = "Checking…"; err.style.display = "none";
  const ok = await verifyToken(token);
  btn.disabled = false; btn.textContent = "Unlock";
  if (!ok) { err.textContent = "Invalid token. Try again."; err.style.display = "block"; return; }

  setToken(token);
  showDashboard();
}

function showDashboard() {
  document.getElementById("lock").style.display = "none";
  document.getElementById("app").style.display = "block";
  init();
}

function lock() {
  clearToken();
  document.getElementById("app").style.display = "none";
  document.getElementById("lock").style.display = "flex";
  document.getElementById("tokenInput").value = "";
  document.getElementById("errMsg").style.display = "none";
}

// ============ DATA ============
async function loadAll() {
  const r = await fetch(MATCHES_URL + "?t=" + Date.now());
  const j = await r.json();
  allMatches = Array.isArray(j.matches) ? j.matches : [];
}

async function loadSelected() {
  try {
    const r = await fetch(
      `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${SELECTED_PATH}?t=${Date.now()}`
    );
    if (!r.ok) return;
    const j = await r.json();
    const sel = j.matches || [];
    selectedIds = new Set(sel.map(m => String(m.event_id)));
  } catch {}
}

// ============ GROUPING ============
function buildLeagueGroups() {
  leagueGroups = {};
  defaultGroupKeys = new Set();

  for (const m of allMatches) {
    const cfg = findWhitelist(m.league_id);

    let key, label;
    if (cfg) {
      key = `W:${cfg.id}`;
      label = cfg.label;
    } else {
      key = `O:${m.league || "Other"}`;
      label = m.league || "Other";
    }

    if (!leagueGroups[key]) {
      leagueGroups[key] = { key, id: cfg ? cfg.id : null, label, matches: [] };
    }
    leagueGroups[key].matches.push(m);

    if (cfg && !isWomenLeague(m.league)) {
      defaultGroupKeys.add(key);
    }
  }
}

function whitelistRank(group) {
  if (group.id == null) return 9999;
  const i = DEFAULT_LEAGUES.findIndex(c => String(c.id) === String(group.id));
  return i === -1 ? 9999 : i;
}

function sortedGroupKeys(groups) {
  return Object.keys(groups).sort((a, b) => {
    const ga = groups[a], gb = groups[b];
    const ra = whitelistRank(ga);
    const rb = whitelistRank(gb);
    if (ra !== rb) return ra - rb;

    const la = ga.label, lb = gb.label;
    const aD = /^[0-9]/.test(la);
    const bD = /^[0-9]/.test(lb);
    if (aD !== bD) return aD ? 1 : -1;
    return la.localeCompare(lb);
  });
}

function populateDropdown() {
  const sel = document.getElementById("leagueFilter");
  const keys = sortedGroupKeys(leagueGroups);

  const defaults = keys.filter(k => defaultGroupKeys.has(k));
  const others = keys.filter(k => !defaultGroupKeys.has(k));

  let html = `<option value="__default__">Default leagues (${defaults.length})</option>`;
  html += `<option value="__all__">All leagues</option>`;

  if (defaults.length) {
    html += `<optgroup label="Top">`;
    html += defaults.map(k => {
      const g = leagueGroups[k];
      return `<option value="${escapeHtml(k)}">${escapeHtml(g.label)} (${g.matches.length})</option>`;
    }).join("");
    html += `</optgroup>`;
  }
  if (others.length) {
    html += `<optgroup label="Other leagues">`;
    html += others.map(k => {
      const g = leagueGroups[k];
      return `<option value="${escapeHtml(k)}">${escapeHtml(g.label)} (${g.matches.length})</option>`;
    }).join("");
    html += `</optgroup>`;
  }

  sel.innerHTML = html;
}

// ============ RENDER ============
function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const filter = document.getElementById("leagueFilter").value;
  const onlySelected = document.getElementById("onlySelected").checked;
  const searching = q.length > 0;

  const content = document.getElementById("content");

  if (!allMatches.length) {
    content.innerHTML = `<div class="empty">No matches available yet.</div>`;
    updateCounter();
    return;
  }

  let groups = leagueGroups;

  // Filter groups
  if (!searching) {
    if (filter === "__default__" || filter === "") {
      groups = {};
      for (const k of defaultGroupKeys) groups[k] = leagueGroups[k];
    } else if (filter === "__all__") {
      // all
    } else if (leagueGroups[filter]) {
      groups = { [filter]: leagueGroups[filter] };
    }
  }

  // Build list of visible matches
  let visible = [];
  const visibleGroups = {};

  for (const k of sortedGroupKeys(groups)) {
    const g = groups[k];
    let list = g.matches;

    if (searching) {
      list = list.filter(m => {
        const hay = ((m.team1 || "") + " " + (m.team2 || "") + " " + (m.league || "")).toLowerCase();
        return hay.includes(q);
      });
    }

    if (onlySelected) {
      list = list.filter(m => selectedIds.has(String(m.event_id)));
    }

    if (list.length) {
      visibleGroups[k] = { ...g, matches: list };
    }
  }

  const keys = sortedGroupKeys(visibleGroups);

  if (!keys.length) {
    content.innerHTML = `<div class="empty">No matches match your filters.</div>`;
    updateCounter();
    return;
  }

  const html = keys.map(k => {
    const g = visibleGroups[k];
    const selectedCount = g.matches.filter(m => selectedIds.has(String(m.event_id))).length;

    const rows = g.matches.map(m => {
      const checked = selectedIds.has(String(m.event_id)) ? "checked" : "";
      return `
        <label class="match">
          <input type="checkbox" ${checked}
                 data-eid="${escapeHtml(String(m.event_id))}"
                 onchange="toggleMatch(this)">
          <div class="teams">
            <div class="names">${escapeHtml(m.team1)} vs ${escapeHtml(m.team2)}</div>
            <div class="sub">${escapeHtml(m.start || "")}</div>
          </div>
          <div class="time">${escapeHtml(formatTime(m.start))}</div>
        </label>
      `;
    }).join("");

    const selBadge = selectedCount > 0
      ? `<span class="badge badge-selected">${selectedCount} selected</span>` : "";

    return `
      <div class="group open" data-lg="${escapeHtml(k)}">
        <div class="group-header" onclick="toggleGroup(this)">
          <div class="left">
            <span class="arrow">▶</span>
            <span class="name">${escapeHtml(g.label)}</span>
          </div>
          <div class="badges">
            ${selBadge}
            <span class="badge badge-total">${g.matches.length}</span>
          </div>
        </div>
        <div class="group-body">${rows}</div>
      </div>
    `;
  }).join("");

  content.innerHTML = html;
  updateCounter();
}

function toggleGroup(header) {
  header.parentElement.classList.toggle("open");
}

function toggleMatch(cb) {
  const eid = String(cb.getAttribute("data-eid"));
  if (cb.checked) selectedIds.add(eid);
  else selectedIds.delete(eid);
  updateCounter();
  updateMySelButton();
}

function updateCounter() {
  document.getElementById("counter").textContent =
    `Selected: ${selectedIds.size} of ${allMatches.length}`;
}

function updateMySelButton() {
  document.getElementById("mySelBtn").textContent =
    `My Selection (${selectedIds.size})`;
}

// ============ MODAL ============
function openModal() {
  const picked = allMatches.filter(m => selectedIds.has(String(m.event_id)));

  document.getElementById("modalTitle").textContent = `My Selection (${picked.length})`;
  document.getElementById("modalFootLeft").textContent =
    `${picked.length} match${picked.length === 1 ? "" : "es"} selected`;

  const body = document.getElementById("modalBody");
  if (!picked.length) {
    body.innerHTML = `<div class="modal-empty">No matches selected yet.<br>Tick some from the list to add them here.</div>`;
  } else {
    body.innerHTML = picked.map(m => `
      <div class="sel-item">
        <div class="sel-info">
          <div class="sel-teams">${escapeHtml(m.team1)} vs ${escapeHtml(m.team2)}</div>
          <div class="sel-meta">${escapeHtml(labelForMatch(m))} · ${escapeHtml(formatTime(m.start))}</div>
        </div>
        <button class="remove" onclick="removeFromSelection('${escapeHtml(String(m.event_id))}')">Remove</button>
      </div>
    `).join("");
  }

  document.getElementById("modalBackdrop").classList.add("open");
}

function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("open");
}

function removeFromSelection(eid) {
  selectedIds.delete(String(eid));
  updateCounter();
  updateMySelButton();
  openModal();
  render();
}

function clearAllSelection() {
  if (!selectedIds.size) return;
  if (!confirm(`Clear all ${selectedIds.size} selected matches?`)) return;
  selectedIds.clear();
  updateCounter();
  updateMySelButton();
  openModal();
  render();
  toast("Cleared — click Save to apply");
}

// ============ SAVE ============
async function saveSelection() {
  const token = getToken();
  if (!token) { lock(); return; }

  const btn = document.getElementById("saveBtn");
  btn.disabled = true; btn.textContent = "Saving…";

  const selectedMatches = allMatches.filter(m => selectedIds.has(String(m.event_id)));

  const payload = { matches: selectedMatches, updated_at: new Date().toISOString() };
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));

  let sha;
  try {
    const r = await fetch(`${API_BASE}?ref=${BRANCH}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (r.ok) { const j = await r.json(); sha = j.sha; }
  } catch {}

  const body = {
    message: "Update selection",
    content, branch: BRANCH,
    ...(sha ? { sha } : {}),
  };

  try {
    const r = await fetch(API_BASE, {
      method: "PUT",
      headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (r.ok) toast("Saved — widget will update shortly");
    else if (r.status === 401 || r.status === 403) { toast("Token no longer valid", true); lock(); }
    else { console.error(await r.text()); toast("Save failed", true); }
  } catch (e) {
    console.error(e);
    toast("Save failed — network error", true);
  }

  btn.disabled = false; btn.textContent = "Save";
}

// ============ INIT ============
async function init() {
  document.getElementById("content").innerHTML = `<div class="loading">Loading matches…</div>`;
  try {
    await loadSelected();
    await loadAll();
  } catch (e) {
    console.error(e);
    document.getElementById("content").innerHTML = `<div class="empty">Failed to load matches.</div>`;
    return;
  }

  buildLeagueGroups();
  populateDropdown();
  updateMySelButton();
  render();
}

// ============ WIRE UP ============
document.getElementById("unlockBtn").addEventListener("click", unlock);
document.getElementById("tokenInput").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
document.getElementById("logoutBtn").addEventListener("click", lock);
document.getElementById("search").addEventListener("input", render);
document.getElementById("leagueFilter").addEventListener("change", render);
document.getElementById("onlySelected").addEventListener("change", render);
document.getElementById("saveBtn").addEventListener("click", saveSelection);
document.getElementById("mySelBtn").addEventListener("click", openModal);
document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("modalClearBtn").addEventListener("click", clearAllSelection);
document.getElementById("modalBackdrop").addEventListener("click", e => {
  if (e.target.id === "modalBackdrop") closeModal();
});
document.getElementById("selectAllBtn").addEventListener("click", () => {
  document.querySelectorAll('#content input[type=checkbox]').forEach(cb => {
    if (!cb.checked) { cb.checked = true; toggleMatch(cb); }
  });
});
document.getElementById("clearBtn").addEventListener("click", clearAllSelection);

window.toggleGroup = toggleGroup;
window.toggleMatch = toggleMatch;
window.removeFromSelection = removeFromSelection;

(async () => {
  const t = getToken();
  if (!t) return;
  const ok = await verifyToken(t);
  if (ok) showDashboard();
  else clearToken();
})();
</script>
</body>
</html>
