<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Selector</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7; color: #222;
    min-height: 100vh;
  }

  /* ---------- LOCK SCREEN ---------- */
  #lock {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  #lock .box {
    background: #fff; border: 1px solid #e0e0e0; border-radius: 14px;
    padding: 32px 28px; max-width: 400px; width: 100%;
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
    text-align: center;
  }
  #lock .lock-icon { font-size: 40px; margin-bottom: 12px; }
  #lock h1 { font-size: 20px; margin-bottom: 6px; font-weight: 700; }
  #lock p { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.5; }
  #lock input {
    width: 100%; padding: 12px 14px;
    border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; font-family: inherit; outline: none;
  }
  #lock input:focus { border-color: #2563eb; }
  #lock button {
    width: 100%; margin-top: 12px;
    padding: 12px; border: none; border-radius: 8px;
    background: #2563eb; color: #fff;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  #lock button:hover { background: #1d4ed8; }
  #lock button:disabled { background: #93b3f5; cursor: wait; }
  #lock .err {
    display: none; margin-top: 12px;
    font-size: 13px; color: #dc2626;
  }

  /* ---------- DASHBOARD ---------- */
  #app { display: none; padding: 20px; max-width: 960px; margin: 0 auto; }
  #app .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
  }
  #app h1 { font-size: 20px; font-weight: 800; }
  #app .topbar-right { display: flex; gap: 8px; align-items: center; }
  #app .counter {
    font-size: 13px; font-weight: 700; color: #2563eb;
    background: #eff6ff; padding: 6px 14px; border-radius: 8px;
    border: 1px solid #dbeafe;
  }
  #app .logout {
    padding: 6px 14px; font-size: 12px; font-weight: 600;
    background: #e5e7eb; border: none; border-radius: 6px;
    cursor: pointer; color: #444;
  }
  #app .logout:hover { background: #d1d5db; }

  .toolbar {
    position: sticky; top: 0; z-index: 10;
    background: #fff; border: 1px solid #e0e0e0;
    border-radius: 10px; padding: 12px;
    margin-bottom: 14px;
    display: flex; flex-wrap: wrap; gap: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  .toolbar input[type=text] {
    flex: 1; min-width: 160px;
    padding: 9px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px; outline: none;
  }
  .toolbar input[type=text]:focus { border-color: #2563eb; }
  .toolbar select {
    padding: 9px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 13px; outline: none;
    background: #fff; cursor: pointer;
    max-width: 220px;
  }
  .toolbar select:focus { border-color: #2563eb; }
  .toolbar button {
    padding: 9px 16px; border: none; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-sec { background: #e5e7eb; color: #222; }
  .btn-sec:hover { background: #d1d5db; }
  .btn-save { background: #16a34a; color: #fff; }
  .btn-save:hover { background: #15803d; }
  .btn-save:disabled { background: #86d0a2; cursor: wait; }

  .toggle {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; color: #444;
    padding: 0 6px; user-select: none; cursor: pointer;
  }
  .toggle input {
    width: 16px; height: 16px; accent-color: #2563eb; cursor: pointer;
  }

  /* ---------- LEAGUE GROUPS ---------- */
  .group {
    background: #fff; border: 1px solid #e0e0e0;
    border-radius: 10px; margin-bottom: 10px; overflow: hidden;
  }
  .group-header {
    padding: 11px 14px; font-weight: 700; font-size: 14px;
    background: #f9fafb; border-bottom: 1px solid transparent;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; user-select: none;
    transition: background .15s;
  }
  .group-header:hover { background: #f1f3f7; }
  .group.open .group-header { border-bottom-color: #eee; }
  .group-header .left {
    display: flex; align-items: center; gap: 8px;
    min-width: 0; flex: 1;
  }
  .group-header .arrow {
    display: inline-block; width: 12px; font-size: 10px;
    color: #888; transition: transform .15s;
  }
  .group.open .group-header .arrow { transform: rotate(90deg); }
  .group-header .name {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .group-header .badges {
    display: flex; gap: 6px; flex-shrink: 0;
  }
  .badge {
    font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 9999px;
  }
  .badge-total {
    background: #eef2f7; color: #666;
  }
  .badge-selected {
    background: #dcfce7; color: #16a34a;
  }
  .group-body {
    display: none;
  }
  .group.open .group-body {
    display: block;
  }

  .match {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid #f0f0f0;
    cursor: pointer; user-select: none;
  }
  .match:last-child { border-bottom: none; }
  .match:hover { background: #fafafa; }
  .match input[type=checkbox] {
    width: 18px; height: 18px; flex-shrink: 0; cursor: pointer;
    accent-color: #2563eb;
  }
  .match .teams { flex: 1; font-size: 14px; min-width: 0; }
  .match .teams .names {
    font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .match .teams .sub {
    font-size: 11px; color: #999; margin-top: 2px;
  }
  .match .time {
    font-size: 12px; color: #666; flex-shrink: 0;
    white-space: nowrap;
  }

  .empty {
    text-align: center; padding: 60px 20px; color: #999;
    font-size: 14px;
  }
  .loading {
    text-align: center; padding: 40px; color: #888;
  }

  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #16a34a; color: #fff;
    padding: 12px 22px; border-radius: 8px;
    font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: #dc2626; }

  @media (max-width: 600px) {
    .toolbar select { max-width: 100%; }
    #app { padding: 12px; }
  }
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock">
  <div class="box">
    <div class="lock-icon">🔒</div>
    <h1>Match Selector</h1>
    <p>Enter your access token to continue.</p>
    <input type="password" id="tokenInput" placeholder="Paste token" autocomplete="off">
    <button id="unlockBtn">Unlock</button>
    <div class="err" id="errMsg">Invalid token. Try again.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="app">
  <div class="topbar">
    <h1>Match Selector</h1>
    <div class="topbar-right">
      <span class="counter" id="counter">Selected: 0 of 0</span>
      <button class="logout" id="logoutBtn">Lock</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Search team or league…">
    <select id="leagueFilter">
      <option value="">All leagues</option>
    </select>
    <label class="toggle">
      <input type="checkbox" id="onlySelected">
      <span>Only selected</span>
    </label>
    <button class="btn-sec" id="selectAllBtn">Select all</button>
    <button class="btn-sec" id="clearBtn">Clear</button>
    <button class="btn-save" id="saveBtn">Save</button>
  </div>

  <div id="content"><div class="loading">Loading…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ------------------------------------------------------------------
// CONFIG
// ------------------------------------------------------------------
const REPO_OWNER = "livepagesmaster";
const REPO_NAME  = "football-worker";
const BRANCH     = "main";

const MATCHES_URL = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/data/all-matches.json`;
const SELECTED_PATH = "data/selected.json";
const API_BASE = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${SELECTED_PATH}`;

const TOKEN_KEY = "gh_token_fw";

// Top leagues — ranked by global popularity. Matched by "contains" (fuzzy).
// Everything not listed here falls into the alphabetical section below.
const TOP_LEAGUES = [
  "Champions League",
  "World Cup",
  "Euro",
  "Premier League",
  "La Liga",
  "Serie A",
  "Bundesliga",
  "Ligue 1",
  "Europa League",
  "Copa Libertadores",
  "Copa Sudamericana",
  "Liga MX",
  "MLS",
  "Brasileirão",
  "Liga Portugal",
  "Eredivisie",
  "FA Cup",
  "Copa del Rey",
  "Coppa Italia",
  "DFB Pokal",
];
// ------------------------------------------------------------------

let allMatches = [];
let selectedIds = new Set();
let groups = {};              // leagueName -> [matches]
let priorityOrder = {};       // leagueName -> rank (0..N-1), else Infinity
let openGroups = new Set();   // which league headers are expanded

// ============ HELPERS ============
function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }

function toast(msg, isError = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("error", isError);
  t.classList.add("show");
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove("show"), 2400);
}

function formatTime(iso) {
  if (!iso) return "";
  try {
    return new Date(iso).toLocaleString([], {
      month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  } catch { return ""; }
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

// ============ VERIFY TOKEN ============
async function verifyToken(token) {
  try {
    const r = await fetch(
      `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`,
      { headers: { Authorization: `Bearer ${token}` } }
    );
    return r.ok;
  } catch { return false; }
}

// ============ UNLOCK / LOCK ============
async function unlock() {
  const input = document.getElementById("tokenInput");
  const btn = document.getElementById("unlockBtn");
  const err = document.getElementById("errMsg");
  const token = input.value.trim();

  if (!token) { err.textContent = "Enter a token."; err.style.display = "block"; return; }

  btn.disabled = true; btn.textContent = "Checking…"; err.style.display = "none";

  const ok = await verifyToken(token);
  btn.disabled = false; btn.textContent = "Unlock";

  if (!ok) { err.textContent = "Invalid token. Try again."; err.style.display = "block"; return; }

  setToken(token);
  showDashboard();
}

function showDashboard() {
  document.getElementById("lock").style.display = "none";
  document.getElementById("app").style.display = "block";
  init();
}

function lock() {
  clearToken();
  document.getElementById("app").style.display = "none";
  document.getElementById("lock").style.display = "flex";
  document.getElementById("tokenInput").value = "";
  document.getElementById("errMsg").style.display = "none";
}

// ============ DATA LOAD ============
async function loadAll() {
  const r = await fetch(MATCHES_URL + "?t=" + Date.now());
  const j = await r.json();
  allMatches = Array.isArray(j.matches) ? j.matches : [];
}

async function loadSelected() {
  try {
    const r = await fetch(
      `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${SELECTED_PATH}?t=${Date.now()}`
    );
    if (!r.ok) return;
    const j = await r.json();
    const sel = j.matches || [];
    selectedIds = new Set(sel.map(m => String(m.event_id)));
  } catch {}
}

// ============ GROUPING & PRIORITY ============
function buildGroups() {
  groups = {};
  for (const m of allMatches) {
    const lg = m.league || "Other";
    (groups[lg] = groups[lg] || []).push(m);
  }

  // Assign priority rank by fuzzy match on TOP_LEAGUES
  priorityOrder = {};
  for (const lg of Object.keys(groups)) {
    const lgLower = lg.toLowerCase();
    let rank = Infinity;
    for (let i = 0; i < TOP_LEAGUES.length; i++) {
      const needle = TOP_LEAGUES[i].toLowerCase();
      if (lgLower.includes(needle)) {
        rank = i;
        break;
      }
    }
    priorityOrder[lg] = rank;
  }
}

function sortedLeagueNames() {
  return Object.keys(groups).sort((a, b) => {
    const pa = priorityOrder[a];
    const pb = priorityOrder[b];
    if (pa !== pb) return pa - pb;
    return a.localeCompare(b);
  });
}

function populateLeagueDropdown() {
  const sel = document.getElementById("leagueFilter");
  const names = sortedLeagueNames();
  sel.innerHTML = `<option value="">All leagues</option>` +
    names.map(n => {
      const count = groups[n].length;
      return `<option value="${escapeHtml(n)}">${escapeHtml(n)} (${count})</option>`;
    }).join("");
}

// ============ RENDER ============
function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const leagueFilter = document.getElementById("leagueFilter").value;
  const onlySelected = document.getElementById("onlySelected").checked;

  const content = document.getElementById("content");

  if (!allMatches.length) {
    content.innerHTML = `<div class="empty">No matches available yet.<br>The scraper hasn't produced any data.</div>`;
    updateCounter();
    return;
  }

  const names = sortedLeagueNames().filter(name => {
    if (leagueFilter && name !== leagueFilter) return false;
    return true;
  });

  if (!names.length) {
    content.innerHTML = `<div class="empty">No leagues to show.</div>`;
    updateCounter();
    return;
  }

  const html = names.map(lg => {
    let list = groups[lg];

    // Filter by search
    if (q) {
      list = list.filter(m => {
        const hay = ((m.team1 || "") + " " + (m.team2 || "") + " " + (m.league || "")).toLowerCase();
        return hay.includes(q);
      });
    }

    // Filter by "only selected"
    if (onlySelected) {
      list = list.filter(m => selectedIds.has(String(m.event_id)));
    }

    if (!list.length) return "";

    const selectedCount = list.filter(m => selectedIds.has(String(m.event_id))).length;
    const isOpen = openGroups.has(lg);

    const rows = list.map(m => {
      const checked = selectedIds.has(String(m.event_id)) ? "checked" : "";
      return `
        <label class="match">
          <input type="checkbox" ${checked}
                 data-eid="${escapeHtml(String(m.event_id))}"
                 onchange="toggleMatch(this)">
          <div class="teams">
            <div class="names">${escapeHtml(m.team1)} vs ${escapeHtml(m.team2)}</div>
            <div class="sub">${escapeHtml(m.start || "")}</div>
          </div>
          <div class="time">${escapeHtml(formatTime(m.start))}</div>
        </label>
      `;
    }).join("");

    const selectedBadge = selectedCount > 0
      ? `<span class="badge badge-selected">${selectedCount} selected</span>`
      : "";

    return `
      <div class="group ${isOpen ? "open" : ""}" data-lg="${escapeHtml(lg)}">
        <div class="group-header" onclick="toggleGroup('${escapeHtml(lg).replace(/'/g, "\\'")}')">
          <div class="left">
            <span class="arrow">▶</span>
            <span class="name">${escapeHtml(lg)}</span>
          </div>
          <div class="badges">
            ${selectedBadge}
            <span class="badge badge-total">${list.length}</span>
          </div>
        </div>
        <div class="group-body">
          ${rows}
        </div>
      </div>
    `;
  }).join("");

  content.innerHTML = html || `<div class="empty">No matches match your filters.</div>`;
  updateCounter();
}

function toggleGroup(lg) {
  if (openGroups.has(lg)) openGroups.delete(lg);
  else openGroups.add(lg);
  render();
}

function toggleMatch(cb) {
  const eid = String(cb.getAttribute("data-eid"));
  if (cb.checked) selectedIds.add(eid);
  else selectedIds.delete(eid);
  updateCounter();

  // Update the league badge live
  const groupEl = cb.closest(".group");
  if (groupEl) {
    const lg = groupEl.getAttribute("data-lg");
    const list = groups[lg].filter(m => {
      const q = document.getElementById("search").value.trim().toLowerCase();
      if (q) {
        const hay = ((m.team1 || "") + " " + (m.team2 || "") + " " + (m.league || "")).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const selCount = list.filter(m => selectedIds.has(String(m.event_id))).length;
    const badge = groupEl.querySelector(".badge-selected");
    if (selCount > 0) {
      if (badge) badge.textContent = selCount + " selected";
      else {
        const container = groupEl.querySelector(".badges");
        const el = document.createElement("span");
        el.className = "badge badge-selected";
        el.textContent = selCount + " selected";
        container.insertBefore(el, container.firstChild);
      }
    } else if (badge) {
      badge.remove();
    }
  }
}

function updateCounter() {
  const total = allMatches.length;
  const sel = selectedIds.size;
  document.getElementById("counter").textContent = `Selected: ${sel} of ${total}`;
}

// ============ SAVE ============
async function saveSelection() {
  const token = getToken();
  if (!token) { lock(); return; }

  const btn = document.getElementById("saveBtn");
  btn.disabled = true; btn.textContent = "Saving…";

  const selectedMatches = allMatches.filter(m =>
    selectedIds.has(String(m.event_id))
  );

  const payload = {
    matches: selectedMatches,
    updated_at: new Date().toISOString(),
  };
  const content = btoa(unescape(encodeURIComponent(
    JSON.stringify(payload, null, 2)
  )));

  let sha;
  try {
    const r = await fetch(`${API_BASE}?ref=${BRANCH}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (r.ok) { const j = await r.json(); sha = j.sha; }
  } catch {}

  const body = {
    message: "Update selection",
    content,
    branch: BRANCH,
    ...(sha ? { sha } : {}),
  };

  try {
    const r = await fetch(API_BASE, {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${token}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify(body),
    });

    if (r.ok) {
      toast("Saved — widget will update shortly");
    } else if (r.status === 401 || r.status === 403) {
      toast("Token no longer valid", true);
      lock();
    } else {
      console.error(await r.text());
      toast("Save failed", true);
    }
  } catch (e) {
    console.error(e);
    toast("Save failed — network error", true);
  }

  btn.disabled = false; btn.textContent = "Save";
}

// ============ INIT ============
async function init() {
  document.getElementById("content").innerHTML =
    `<div class="loading">Loading matches…</div>`;

  try {
    await loadSelected();
    await loadAll();
  } catch (e) {
    console.error(e);
    document.getElementById("content").innerHTML =
      `<div class="empty">Failed to load matches.</div>`;
    return;
  }

  buildGroups();
  populateLeagueDropdown();

  // Open top leagues by default
  const names = sortedLeagueNames();
  for (const n of names) {
    if (priorityOrder[n] !== Infinity) openGroups.add(n);
  }

  render();
}

// ============ WIRE UP ============
document.getElementById("unlockBtn").addEventListener("click", unlock);
document.getElementById("tokenInput").addEventListener("keydown", e => {
  if (e.key === "Enter") unlock();
});
document.getElementById("logoutBtn").addEventListener("click", lock);
document.getElementById("search").addEventListener("input", render);
document.getElementById("leagueFilter").addEventListener("change", render);
document.getElementById("onlySelected").addEventListener("change", render);
document.getElementById("saveBtn").addEventListener("click", saveSelection);

document.getElementById("selectAllBtn").addEventListener("click", () => {
  document.querySelectorAll('#content input[type=checkbox]').forEach(cb => {
    if (!cb.checked) { cb.checked = true; toggleMatch(cb); }
  });
});
document.getElementById("clearBtn").addEventListener("click", () => {
  document.querySelectorAll('#content input[type=checkbox]').forEach(cb => {
    if (cb.checked) { cb.checked = false; toggleMatch(cb); }
  });
});

// Auto-unlock if token already stored
(async () => {
  const t = getToken();
  if (!t) return;
  const ok = await verifyToken(t);
  if (ok) showDashboard();
  else clearToken();
})();
</script>
</body>
</html>
