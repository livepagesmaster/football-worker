name: Build Blogs Feed

on:
  workflow_dispatch:          # allows manual "Run workflow" button
  push:
    paths:
      - 'data/blogs/**'       # runs whenever a blog is added/edited
      - 'scripts/build_blogs.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build blogs.json
        run: python scripts/build_blogs.py

      - name: Commit blogs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/blogs.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Rebuild blogs.json"
            git push
          fi
