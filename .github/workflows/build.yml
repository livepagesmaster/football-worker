name: Build Widget Feed

on:
  schedule:
    - cron: '5 * * * *'      # 5 min after each scrape
  workflow_dispatch:
  push:
    paths:
      - 'data/selected.json'
      - 'data/all-matches.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build feed
        run: python scripts/build_feed.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matchfeed.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Rebuild widget feed"
            git push
          fi
          
      - name: Upload matchfeed to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy data --project-name=football-feed
